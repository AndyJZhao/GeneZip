name: Bug report
description: Report an installation, training or evaluation problem.
title: "[Bug] "
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
      description: Describe what you expected and what happened.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction command
      description: Include the model, task and configuration overrides.
      render: shell
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include your operating system, GPU, Python, PyTorch and CUDA versions.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Traceback or logs
      description: Remove credentials and private data before sharing logs.
      render: text
