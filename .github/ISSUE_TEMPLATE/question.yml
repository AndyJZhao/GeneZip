name: Question
description: Ask about models, task configurations or reproduction.
title: "[Question] "
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: Describe what you would like to do and where you need help.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Relevant command or configuration
      description: Include the model and task when applicable.
      render: shell
