<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" role="img" aria-labelledby="title desc"><title id="title">Efficient long-context inference</title><desc id="desc">GeneZip: 6.34 seconds. JanusDNA: 228.63 seconds. Same 100 sequences of 450 kb, one H100, model-specific batch sizes. GeneZip has 36.1 times higher throughput.</desc><rect width="960" height="350" fill="white"/><g font-family="Arial, Helvetica, sans-serif" fill="#243344"><text x="24" y="65" fill="#c64c2e" font-size="55" font-weight="700">36.1×</text><text x="215" y="44" font-size="23" font-weight="700">Higher inference throughput</text><text x="215" y="76" font-size="20" fill="#748294">than JanusDNA on 450-kb inputs</text><line x1="200.0" x2="200.0" y1="116" y2="256" stroke="#e2e7ec"/><text x="200.0" y="282" font-size="18" text-anchor="middle" fill="#748294">0</text><line x1="362.5" x2="362.5" y1="116" y2="256" stroke="#e2e7ec"/><text x="362.5" y="282" font-size="18" text-anchor="middle" fill="#748294">60</text><line x1="525.0" x2="525.0" y1="116" y2="256" stroke="#e2e7ec"/><text x="525.0" y="282" font-size="18" text-anchor="middle" fill="#748294">120</text><line x1="687.5" x2="687.5" y1="116" y2="256" stroke="#e2e7ec"/><text x="687.5" y="282" font-size="18" text-anchor="middle" fill="#748294">180</text><line x1="850.0" x2="850.0" y1="116" y2="256" stroke="#e2e7ec"/><text x="850.0" y="282" font-size="18" text-anchor="middle" fill="#748294">240</text><text x="24" y="157" font-size="20" font-weight="600">JanusDNA-7.7M</text><rect x="200" y="132" width="619.206" height="36" rx="2" fill="#8796a6"/><text x="831.206" y="157" font-size="20" font-weight="600">228.63 s</text><text x="24" y="229" font-size="20" font-weight="600">GeneZip-70M</text><rect x="200" y="204" width="17.171" height="36" rx="2" fill="#c64c2e"/><text x="229.171" y="229" font-size="20" font-weight="600">6.34 s</text><text x="525" y="327" text-anchor="middle" font-size="19" fill="#748294">Time to process 100 sequences (s) · lower is better</text></g></svg>